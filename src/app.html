<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#EDEDE9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
		<meta name="author" content="Zbyněk Židlický" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
		/>
		<script>
			document.documentElement.classList.add('js')
			try {
				const saved = localStorage.getItem('theme')
				const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
				if (dark) document.documentElement.classList.add('dark')
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
